kind = "web"
previewPath = "/"
title = "Inventory"
description = "A simple inventory management app for organizing parts and hardware. Users can search inventory across item details, filter by category, view item information and similar items, and add or edit stock records with images."
version = "1.0.0"
id = "artifacts/inventory-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24449

[services.development]
run = "pnpm --filter @workspace/inventory-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/inventory-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/inventory-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24449"
BASE_PATH = "/"
